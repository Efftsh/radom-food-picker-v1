<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Food Picker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="header">
        <h1>Random Food Picker</h1>
        <p class="h1 subtitle">Click "List" to view all food choices</p>
      </div>

      <div class="display-card">
        <h2 class="display">Click Random to generate food!</h2>
      </div>

      <div class="controls">
        <div class="input-group">
          <input type="text" class="food-input" placeholder="Enter food name..." />
          <button class="button btn-add">Add</button>
        </div>
        
        <div class="action-buttons">
          <button class="button-list btn-secondary">List</button>
          <button class="button-random btn-primary">Random</button>
        </div>
      </div>

      <div class="list-container">
        <ul class="list hidden"></ul>
      </div>
    </div>

    <script src="project.js"></script>
  </body>
</html>
